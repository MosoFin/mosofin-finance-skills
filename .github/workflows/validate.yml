name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skill conformance
        run: |
          chmod +x scripts/validate-skill.sh
          scripts/validate-skill.sh skills

      - name: No .DS_Store committed
        run: |
          if find . -name .DS_Store -not -path './.git/*' | grep -q .; then
            echo "::error::.DS_Store files present"
            find . -name .DS_Store -not -path './.git/*'
            exit 1
          fi

      - name: Every shipped skill is in the queue
        run: |
          total=$(grep -vc '^#' deploy-queue.tsv)
          shipped=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "shipped $shipped of $total planned skills"
          rc=0
          for d in skills/*/; do
            n=$(basename "$d")
            grep -qP "^[^#]*\t${n}\t" deploy-queue.tsv || {
              echo "::error::$n is not listed in deploy-queue.tsv"; rc=1; }
          done
          exit $rc
